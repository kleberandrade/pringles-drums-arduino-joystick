[platformio]
default_envs = promicro-calibration

[env]
platform = atmelavr@5.3.0
board = sparkfun_promicro16
framework = arduino
lib_deps = arduino-libraries/Keyboard@1.0.7
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:promicro-calibration]
build_flags = ${env.build_flags} -DDRUMS_ENABLE_HID=0

[env:promicro-hid]
build_flags = ${env.build_flags} -DDRUMS_ENABLE_HID=1
