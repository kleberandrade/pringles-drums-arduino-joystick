name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Host behavior and fake hardware tests
        run: ./scripts/test.sh
      - name: Deterministic example
        run: ./scripts/example.sh
      - name: Compile Pro Micro calibration and keyboard firmware
        run: pio run -e promicro-calibration -e promicro-hid
      - name: Check patch whitespace
        run: git diff --check
